  - id: marketing
    title: Marketing
    email: marketing@sharadasoft.com
    owns:
      - Campaigns, brand, press, demand gen requests
    escalate_to: goverdhan@sharadasoft.com
    sla_hours: 24

  - id: content
    title: Content
    email: content@sharadasoft.com
    owns:
      - Writing, assets, editorial calendar
    escalate_to: marketing@sharadasoft.com
    sla_hours: 48

  - id: growth
    title: Growth
    email: growth@sharadasoft.com
    owns:
      - Experiments, funnels, acquisition loops
    escalate_to: marketing@sharadasoft.com
    sla_hours: 48

  - id: product
    title: Product
    email: product@sharadasoft.com
    owns:
      - Feature requests, roadmap prioritization, specs
    escalate_to: goverdhan@sharadasoft.com
    sla_hours: 48

  - id: engineering
    title: Engineering
    email: engineering@sharadasoft.com
    owns:
      - Bugs, technical design, incidents, infra
    escalate_to: goverdhan@sharadasoft.com
    sla_hours: 8

  - id: devrel
    title: DevRel
    email: devrel@sharadasoft.com
    owns:
      - Developer community, API docs asks, advocacy
    escalate_to: engineering@sharadasoft.com
    sla_hours: 48

  - id: hr_recruiting
    title: HR / People + Recruiting
    email: hr@sharadasoft.com
    owns:
      - Hiring, interviews, people ops, candidates
    escalate_to: goverdhan@sharadasoft.com
    sla_hours: 24

  - id: legal
    title: Legal
    email: legal@sharadasoft.com
    owns:
      - Contracts, NDAs, compliance reviews
    escalate_to: dayanand@sharadasoft.com
    sla_hours: 48

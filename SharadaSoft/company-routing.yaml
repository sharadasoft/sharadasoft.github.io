    auto_reply: false
    sla_hours: 2

  - id: it
    title: IT / Admin
    email: chanakshi@sharadasoft.com
    owns:
      - Access, devices, tooling, account provisioning
    escalate_to: goverdhan@sharadasoft.com
    sla_hours: 24

  - id: partnerships
    title: Partnerships
    email: Sharada@sharadasoft.com
    owns:
      - Partners, affiliates, channel deals
    escalate_to: sudarshan@sharadasoft.com
    sla_hours: 48

  - id: research
    title: Research
    email: sandhya@sharadasoft.com
    owns:
      - Market intel, competitive research briefs
    escalate_to: goverdhan@sharadasoft.com
    sla_hours: 72

escalation_chains:
  support: |
    support@ → support-l2@ → engineering@ (tech) OR product@ (product gap)
    → goverdhan@ → dayanand@
  sales: |
    soni@ → darshan@ → sudarshan@ → goverdhan@ → dayanand@
  billing: |
    billing@ → girija@ → goverdhan@ → dayanand@
  security: |
    security@ → goverdhan@ + dayanand@ (parallel; no auto-reply)
  legal: |
    legal@ → dayanand@ (human approve before external send)
  marketing: |
    content@|growth@ → marketing@ → goverdhan@
  product_eng: |
    product@|devrel@ → engineering@ → goverdhan@ → dayanand@
  people: |
    hr@ → goverdhan@ → dayanand@
  partnerships: |
    Sharada@ → sudarshan@ → goverdhan@

operating_rules:
  - Router forwards once; specialists own the thread after handoff.
  - Never CC the whole company; escalate one level at a time.
  - Security and Legal never auto-reply to untrusted external senders.
  - Refunds, contracts, and pricing exceptions require human approval before send.
  - If intent is unclear after one clarifying reply, route to COO.
  - VIP / named accounts go Chief of Staff → CEO, not general support.

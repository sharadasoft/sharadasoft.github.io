    escalate_to: goverdhan@sharadasoft.com
    sla_hours: 8

  - id: support_l1
    title: Support L1
    email: support@sharadasoft.com
    owns:
      - How-to, account help, known issues, first response
    escalate_to: support-l2@sharadasoft.com
    sla_hours: 4

  - id: support_l2
    title: Support L2
    email: support-l2@sharadasoft.com
    owns:
      - Complex repros, escalated tickets, workarounds
    escalate_to: engineering@sharadasoft.com
    sla_hours: 8

  - id: billing
    title: Billing
    email: billing@sharadasoft.com
    owns:
